{% load static %}<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->

  <script src="{% static "/web_client/ogvjs-1.8.6/ogv.js" %}"></script>
  <script>
    var api = ["{{domain}}"];
    var serverHost = "{{domain}}" || window.location.hostname;
    var serverKey = "{{ public_key }}";
    var targetPeerId = "{{ peer_id|escapejs }}";
    var targetPeerAlias = "{{ peer_alias|escapejs }}";
    var targetPeerHostname = "{{ peer_hostname|escapejs }}";
    try {
      localStorage.setItem("key", serverKey);
      localStorage.setItem("custom-rendezvous-server", serverHost);
      localStorage.setItem("rendezvous-server", serverHost);

      var existingPeers = {};
      try {
        existingPeers = JSON.parse(localStorage.getItem("peers")) || {};
      } catch (e) {}
      if (!existingPeers[targetPeerId]) {
        existingPeers[targetPeerId] = {
          id: targetPeerId,
          alias: targetPeerAlias,
          hostname: targetPeerHostname,
          "show-remote-cursor": "Y"
        };
      } else {
        existingPeers[targetPeerId]["show-remote-cursor"] = "Y";
      }
      localStorage.setItem("peers", JSON.stringify(existingPeers));
      localStorage.setItem("show-remote-cursor", "Y");
    } catch (err) {
      console.error("Storage init error:", err);
    }
  </script>
  <script type="module" crossorigin src={% static "/web_client/module/index.b7bb6fa2.js" %}></script>
  
  <script src="{% static "/web_client/js/yuv-canvas-1.2.6.js" %}"></script>
  <style>
    /* Force visible cursor on Flutter Web remote screen */
    html, body, flt-glass-pane, canvas, flutter-view, [flt-renderer] {
      cursor: crosshair !important;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .loader {
      border: 16px solid #f3f3f3;
      border-radius: 50%;
      border: 15px solid;
      border-top: 16px solid #024eff;
      border-right: 16px solid white;
      border-bottom: 16px solid #024eff;
      border-left: 16px solid white;
      width: 120px;
      height: 120px;
      -webkit-animation: spin 2s linear infinite;
      animation: spin 2s linear infinite;
    }

    @-webkit-keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

</head>

<body>
  <div class="loading">
    <div class="loader"></div>
  </div>
  <!-- This script installs service_worker.js to provide PWA functionality to
       application. For more information, see:
       https://developers.google.com/web/fundamentals/primers/service-workers -->
  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = '{% static "/web_client/js/main.dart.js" %}';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      // Service workers are supported. Use them.
      window.addEventListener('load', function () {
        // Wait for registration to finish before dropping the <script> tag.
        // Otherwise, the browser will load the script multiple times,
        // potentially different versions.
        var serviceWorkerUrl = '{% static "/web_client/flutter_service_worker.js" %}?v=' + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function waitForActivation(serviceWorker) {
              serviceWorker.addEventListener('statechange', () => {
                if (serviceWorker.state == 'activated') {
                  console.log('Installed new service worker.');
                  loadMainDartJs();
                }
              });
            }
            if (!reg.active && (reg.installing || reg.waiting)) {
              // No active web worker and we have installed or are installing
              // one for the first time. Simply wait for it to activate.
              waitForActivation(reg.installing || reg.waiting);
            } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
              // When the app updates the serviceWorkerVersion changes, so we
              // need to ask the service worker to update.
              console.log('New service worker available.');
              reg.update();
              waitForActivation(reg.installing);
            } else {
              // Existing service worker is still good.
              console.log('Loading app from service worker.');
              loadMainDartJs();
            }
          });

        // If service worker doesn't succeed in a reasonable amount of time,
        // fallback to plaint <script> tag.
        setTimeout(() => {
          if (!scriptLoaded) {
            console.warn(
              'Failed to load app from service worker. Falling back to plain <script> tag.',
            );
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      // Service workers not supported. Just drop the <script> tag.
      loadMainDartJs();
    }
  </script>

  <!-- High-visibility mouse reticle overlay for remote control -->
  <div id="remote-mouse-reticle" style="position: fixed; width: 16px; height: 16px; border: 2px solid #0284c7; background: rgba(2, 132, 199, 0.25); border-radius: 50%; pointer-events: none; z-index: 2147483647; transform: translate(-50%, -50%); display: none; box-shadow: 0 0 6px rgba(2, 132, 199, 0.8);">
    <div style="position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; background: #ffffff; transform: translate(-50%, -50%); border-radius: 50%;"></div>

  <!-- SKEUOMORPHIC FLOATING ANDROID NAVIGATION DOCK -->
  <style>
    .android-nav-dock {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483646;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 14px;
      background: linear-gradient(180deg, rgba(26, 36, 52, 0.94) 0%, rgba(15, 23, 36, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 40px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 0 1px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      user-select: none;
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .android-nav-dock:hover {
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 0 14px rgba(2, 132, 199, 0.35);
    }
    .nav-dock-handle {
      cursor: grab;
      display: flex;
      align-items: center;
      padding: 0 4px;
      color: rgba(255, 255, 255, 0.4);
      transition: color 0.15s;
    }
    .nav-dock-handle:hover {
      color: rgba(255, 255, 255, 0.9);
    }
    .nav-dock-handle:active {
      cursor: grabbing;
    }
    .nav-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(180deg, #2a374a 0%, #17212e 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 3px 0 #0d141e, 0 4px 8px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.1s ease;
      outline: none;
    }
    .nav-btn:hover {
      color: #38bdf8;
      background: linear-gradient(180deg, #33435c 0%, #1e2b3c 100%);
      box-shadow: 0 3px 0 #0d141e, 0 6px 14px rgba(2, 132, 199, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .nav-btn:active, .nav-btn.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0d141e, inset 0 2px 4px rgba(0, 0, 0, 0.65);
      color: #0284c7;
      background: linear-gradient(180deg, #141c26 0%, #1c2736 100%);
    }
    .nav-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .nav-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.14);
      margin: 0 2px;
    }
    .nav-feedback-toast {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid #0284c7;
      color: #38bdf8;
      padding: 4px 12px;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace, sans-serif;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }
    .nav-feedback-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }
  </style>

  <div class="android-nav-dock" id="android-nav-dock">
    <div class="nav-feedback-toast" id="nav-feedback-toast">BACK</div>

    <!-- Drag Handle -->
    <div class="nav-dock-handle" id="nav-dock-drag" title="Drag to reposition navigation dock">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="currentColor">
        <circle cx="3" cy="4" r="1.5"/><circle cx="9" cy="4" r="1.5"/>
        <circle cx="3" cy="10" r="1.5"/><circle cx="9" cy="10" r="1.5"/>
        <circle cx="3" cy="16" r="1.5"/><circle cx="9" cy="16" r="1.5"/>
      </svg>
    </div>

    <!-- 1. BACK BUTTON -->
    <button class="nav-btn" id="nav-btn-back" onclick="sendDeviceNav('back')" title="Back (Esc / Alt+←)">
      <svg viewBox="0 0 24 24">
        <!-- Android Triangle Back Icon -->
        <polygon points="18,5 6,12 18,19" />
      </svg>
    </button>

    <!-- 2. HOME BUTTON -->
    <button class="nav-btn" id="nav-btn-home" onclick="sendDeviceNav('home')" title="Home (Alt+H / Home)">
      <svg viewBox="0 0 24 24">
        <!-- Android Circle Home Icon -->
        <circle cx="12" cy="12" r="7" />
      </svg>
    </button>

    <!-- 3. RECENT APPS BUTTON -->
    <button class="nav-btn" id="nav-btn-recents" onclick="sendDeviceNav('recents')" title="Recent Apps (Alt+R / Alt+Tab)">
      <svg viewBox="0 0 24 24">
        <!-- Android Square Recents Icon -->
        <rect x="6" y="6" width="12" height="12" rx="2" ry="2" />
      </svg>
    </button>

    <div class="nav-divider"></div>

    <!-- 4. NOTIFICATION SHADE PULL-DOWN -->
    <button class="nav-btn" id="nav-btn-notifications" onclick="sendDeviceNav('notifications')" title="Pull Down Notifications / Quick Settings (Alt+N)">
      <svg viewBox="0 0 24 24">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
    </button>

    <!-- 5. POWER / WAKE BUTTON -->
    <button class="nav-btn" id="nav-btn-power" onclick="sendDeviceNav('power')" title="Power / Lock Screen (Alt+P)">
      <svg viewBox="0 0 24 24">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
        <line x1="12" y1="2" x2="12" y2="12" />
      </svg>
    </button>
  </div>

  <script>
    (function() {
      // Mouse Reticle tracking
      var reticle = document.getElementById('remote-mouse-reticle');
      if (reticle) {
        window.addEventListener('mousemove', function(e) {
          reticle.style.left = e.clientX + 'px';
          reticle.style.top = e.clientY + 'px';
          reticle.style.display = 'block';
        }, { passive: true });
        window.addEventListener('mouseleave', function() {
          reticle.style.display = 'none';
        });
        window.addEventListener('mousedown', function() {
          reticle.style.transform = 'translate(-50%, -50%) scale(0.85)';
          reticle.style.background = 'rgba(244, 63, 94, 0.5)';
          reticle.style.borderColor = '#f43f5e';
        });
        window.addEventListener('mouseup', function() {
          reticle.style.transform = 'translate(-50%, -50%) scale(1)';
          reticle.style.background = 'rgba(2, 132, 199, 0.25)';
          reticle.style.borderColor = '#0284c7';
        });
      }

      // Android Navigation Dispatch
      var apiKey = "{{ api_key|escapejs }}";
      var targetId = "{{ peer_id|escapejs }}";
      var feedbackToast = document.getElementById('nav-feedback-toast');
      var toastTimer = null;

      function showNavFeedback(label) {
        if (!feedbackToast) return;
        feedbackToast.textContent = label;
        feedbackToast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
          feedbackToast.classList.remove('show');
        }, 1200);
      }

      window.sendDeviceNav = function(action) {
        var btn = document.getElementById('nav-btn-' + action);
        if (btn) {
          btn.classList.add('active');
          setTimeout(function() { btn.classList.remove('active'); }, 180);
        }

        var labels = {
          'back': 'BACK (◀)',
          'home': 'HOME (●)',
          'recents': 'RECENTS (▢)',
          'notifications': 'NOTIFICATIONS (▼)',
          'power': 'POWER (⏻)'
        };
        showNavFeedback(labels[action] || action.toUpperCase());

        // 1. Dispatch API call to NinjaDesk server (broadcasts instant MQTT command to device)
        fetch('/api/device/navigation/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Ninja-Api-Key': apiKey
          },
          body: JSON.stringify({
            id: targetId,
            action: action
          })
        }).then(function(res) {
          return res.json();
        }).then(function(data) {
          console.log('[Navigation] Dispatched ' + action + ':', data);
        }).catch(function(err) {
          console.warn('[Navigation] Dispatch failed:', err);
        });

        // 2. Also simulate synthetic keyboard event for RustDesk Flutter canvas if applicable
        try {
          var keyMap = {
            'back': { key: 'Escape', code: 'Escape', keyCode: 27 },
            'home': { key: 'Home', code: 'Home', keyCode: 36 }
          };
          var k = keyMap[action];
          if (k) {
            var ev = new KeyboardEvent('keydown', {
              key: k.key,
              code: k.code,
              keyCode: k.keyCode,
              which: k.keyCode,
              bubbles: true
            });
            window.dispatchEvent(ev);
            document.dispatchEvent(ev);
          }
        } catch (e) {}
      };

      // Keyboard Shortcuts
      window.addEventListener('keydown', function(e) {
        // Ignore if user is currently typing in an input field
        var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea') return;

        if (e.key === 'Escape' || (e.altKey && e.key === 'ArrowLeft')) {
          e.preventDefault();
          window.sendDeviceNav('back');
        } else if ((e.altKey && (e.key === 'h' || e.key === 'H')) || e.key === 'Home') {
          e.preventDefault();
          window.sendDeviceNav('home');
        } else if (e.altKey && (e.key === 'r' || e.key === 'R' || e.key === 'Tab')) {
          e.preventDefault();
          window.sendDeviceNav('recents');
        } else if (e.altKey && (e.key === 'n' || e.key === 'N')) {
          e.preventDefault();
          window.sendDeviceNav('notifications');
        } else if (e.altKey && (e.key === 'p' || e.key === 'P')) {
          e.preventDefault();
          window.sendDeviceNav('power');
        }
      });

      // Draggable Navigation Dock
      var dock = document.getElementById('android-nav-dock');
      var handle = document.getElementById('nav-dock-drag');
      if (dock && handle) {
        var isDragging = false;
        var startX = 0, startY = 0;
        var initialLeft = 0, initialTop = 0;

        handle.addEventListener('mousedown', function(e) {
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          var rect = dock.getBoundingClientRect();
          initialLeft = rect.left;
          initialTop = rect.top;
          dock.style.bottom = 'auto';
          dock.style.transform = 'none';
          dock.style.left = initialLeft + 'px';
          dock.style.top = initialTop + 'px';
          document.body.style.userSelect = 'none';
          e.preventDefault();
        });

        window.addEventListener('mousemove', function(e) {
          if (!isDragging) return;
          var dx = e.clientX - startX;
          var dy = e.clientY - startY;
          var newLeft = Math.max(10, Math.min(window.innerWidth - dock.offsetWidth - 10, initialLeft + dx));
          var newTop = Math.max(10, Math.min(window.innerHeight - dock.offsetHeight - 10, initialTop + dy));
          dock.style.left = newLeft + 'px';
          dock.style.top = newTop + 'px';
        });

        window.addEventListener('mouseup', function() {
          if (isDragging) {
            isDragging = false;
            document.body.style.userSelect = '';
          }
        });
      }
    })();
  </script>
</body>

</html>
